      - "scripts/source-tests/test_hyperget_icon_resource_audit.py"

permissions:
  contents: read

concurrency:
  # Isolate each exact PR head so a later docs-only run cannot cancel a pending acceptance build.
  group: windows-installed-ui-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  # Preserve an active exact-SHA acceptance run when later docs-only commits arrive.
  cancel-in-progress: false

jobs:
  change-scope:
    name: Decide whether the full PR diff needs an installed UI run
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out exact PR head and parent for scope detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Gate installed GUI packaging on the full PR diff
        id: scope
        env:
          HYPERGET_EVENT_BEFORE: ${{ github.event.before || '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
            printf 'Full PR diff against origin/%s:\n%s\n' "$GITHUB_BASE_REF" "$changed"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            before="$HYPERGET_EVENT_BEFORE"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
            else
              changed="$(git show --pretty='' --name-only HEAD)"
            fi
            printf 'Push change range:\n%s\n' "$changed"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          run=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/windows-installed-ui-smoke.yml|desktop/app/resources/installer/nsis-script-template.nsi|desktop/app/build.gradle.kts|desktop/app/icons/icon.ico|desktop/app/icons/hyperget-icon.svg|scripts/Run-WindowsInstallerLifecycleE2E.ps1|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/HomePage.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/HomeComponent.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/HomeWindow.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/DownloadList.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/singleDownloadPage/ProgressDownloadPage.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/singleDownloadPage/ShowDownloadDialogs.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/singleDownloadPage/SingleDownloadPageStateToPersist.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/IDefaultAppIPCService.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/DefaultAppIPCServiceImpl.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/download/Download.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/download/open/OpenDownload.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/ui/theme/DefaultThemes.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/storage/appsettings/DefaultAppSettings.kt|shared/app/src/desktopTest/kotlin/com/abdownloadmanager/shared/ui/theme/ModernThemePaletteContractTest.kt|shared/app/src/desktopMain/kotlin/com/abdownloadmanager/shared/ui/widget/table/customtable/TableUtils.kt|shared/app/src/desktopTest/kotlin/com/abdownloadmanager/shared/ui/widget/table/customtable/TableStatePersistenceTest.kt|scripts/Run-WindowsMultiFileDropE2E.ps1|scripts/Run-WindowsLiquidProgressVisualE2E.ps1|scripts/Wait-WindowsLoopbackHttpPort.ps1|scripts/source-tests/test_hyperget_liquid_progress_source.py|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/pages/home/BaseHomeComponent.kt|shared/app/src/desktopTest/kotlin/com/abdownloadmanager/shared/pages/home/DownloadSearchMatcherTest.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/pages/home/DroppedLinkFiles.kt|shared/app/src/desktopTest/kotlin/com/abdownloadmanager/shared/pages/home/DroppedLinkFilesTest.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/extractors/linkextractor/StringUrlExtractor.kt|shared/app/src/desktopTest/kotlin/com/abdownloadmanager/shared/util/extractors/linkextractor/StringUrlExtractorMixedListTest.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt|scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py)
                run=true ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
  install-launch-and-capture:
    name: Clean silent NSIS install and GUI launch
    needs: change-scope
    if: needs.change-scope.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"

    steps:
      - name: Check out exact PR head (not synthetic merge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Parse PowerShell acceptance harnesses before installer build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/Wait-WindowsLoopbackHttpPort.ps1',
            'scripts/Run-WindowsLiquidProgressVisualE2E.ps1',
            'scripts/Run-WindowsMultiFileDropE2E.ps1',
            'scripts/Run-WindowsInstallerLifecycleE2E.ps1'
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $fullPath = (Resolve-Path -LiteralPath $scriptPath).Path
            [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $details = @($parseErrors | ForEach-Object { "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)" }) -join "`n"
              throw "PowerShell parse failed for $scriptPath`n$details"
            }
            Write-Host "PASS: PowerShell parse: $scriptPath"
          }

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Liquid Progress typography and theme selection source contracts
        shell: pwsh
        run: python -m unittest discover -s scripts/source-tests -p test_hyperget_liquid_progress_source.py -v

      - name: Verify candidate theme colors and readable palettes
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          :shared:app:desktopTest
          --tests com.abdownloadmanager.shared.ui.theme.ModernThemePaletteContractTest
          --tests com.abdownloadmanager.shared.ui.widget.table.customtable.TableStatePersistenceTest
          --tests com.abdownloadmanager.shared.pages.home.DownloadSearchMatcherTest
          --tests com.abdownloadmanager.shared.pages.home.DroppedLinkFilesTest
          --tests com.abdownloadmanager.shared.util.extractors.linkextractor.StringUrlExtractorMixedListTest

      - name: Build Windows installer from same source SHA
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install single NSIS EXE in isolated runner directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $PWD 'build/ci-release/binaries'
          $installers = @(Get-ChildItem -LiteralPath $packages -File -Filter '*.exe' -Recurse)
          if ($installers.Count -ne 1) { throw "Expected 1 installer, found $($installers.Count)" }
          $isolated = Join-Path $env:RUNNER_TEMP 'idm-smoke'
          if (Test-Path -LiteralPath $isolated) { throw "Test installation already exists: $isolated" }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
          Write-Host "Installer SHA256: $digest"
          "IDM_SMOKE_INSTALLER=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # NSIS: /S silent; /D=destination must be the FINAL argument.
          $installation = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$isolated") -PassThru
          # Start-Process -Wait waits for the entire descendant process tree.
          # Some installers auto-launch the desktop app, so use an explicit
          # bounded wait for the installer process itself instead.
          if (-not $installation.WaitForExit(180000)) {
            Stop-Process -Id $installation.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent installer did not exit within 180 seconds.'
          }
          if ($installation.ExitCode -ne 0) { throw "Installer exit code: $($installation.ExitCode)" }
          # /S must NEVER auto-start the GUI. If it does, a later explicit
          # launch would measure two instances and hide installer defects.
          Start-Sleep -Seconds 2
          $unexpectedGui = @(Get-Process -Name 'DownloadManager','HyperGet' -ErrorAction SilentlyContinue)
          if ($unexpectedGui.Count -gt 0) {
            throw 'Regression: silent NSIS installer started the GUI unexpectedly.'
          }
          if (-not (Test-Path -LiteralPath $isolated -PathType Container)) {
            throw 'Installer did not create the isolated destination.'
          }
          $apps = @(Get-ChildItem -LiteralPath $isolated -Recurse -File -Filter 'HyperGet.exe')
          $legacyApps = @(Get-ChildItem -LiteralPath $isolated -Recurse -File -Filter 'DownloadManager.exe')
          if ($apps.Count -ne 1 -or $legacyApps.Count -ne 0) {
            throw "Expected exactly one HyperGet.exe and no legacy DownloadManager.exe; branded=$($apps.Count), legacy=$($legacyApps.Count)"
          }
          $main = $apps[0]
          Write-Host "Installed app: $($main.FullName)"
          $cliApps = @(Get-ChildItem -LiteralPath $isolated -Recurse -File -Filter 'DownloadManagerCli.exe')
          if ($cliApps.Count -ne 1) { throw "Expected one installed CLI executable, found $($cliApps.Count)." }
          Write-Host "Installed CLI: $($cliApps[0].FullName)"
          "IDM_SMOKE_EXECUTABLE=$($main.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IDM_SMOKE_CLI=$($cliApps[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - name: Audit embedded HyperGet icon resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/audit_windows_icon_resources.py `
            --source-icon desktop/app/icons/icon.ico `
            --application-exe $env:IDM_SMOKE_EXECUTABLE `
            --installer-exe $env:IDM_SMOKE_INSTALLER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Launch installed desktop app and capture Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $env:IDM_SMOKE_EXECUTABLE
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Installed app missing.' }
          $started = Start-Process -FilePath $exe -PassThru
          $visible = @()
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              $visible = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
                $_.ProcessName -match '^(HyperGet|DownloadManager)$' -and $_.MainWindowHandle -ne [IntPtr]::Zero
              })
              if ($visible.Count -gt 0) { break }
            }
            if ($visible.Count -eq 0) {
              throw 'Installed app started but no main window was detected in 20 seconds.'
            }
            Write-Host "Detected $($visible.Count) GUI process(es)."
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HyperGetUiSmokeNative {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle);
              [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr handle);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out RECT rect);
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint x, uint y, uint data, UIntPtr extra);
              [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr handle, IntPtr insertAfter, int x, int y, int cx, int cy, uint flags);
          }
          '@
            Add-Type -AssemblyName System.Drawing
            $window = $visible | Select-Object -First 1
            $windowHandle = $window.MainWindowHandle
            [HyperGetUiSmokeNative]::ShowWindow($windowHandle, 3) | Out-Null
            [HyperGetUiSmokeNative]::SetWindowPos($windowHandle, [IntPtr](-1), 0, 0, 0, 0, [uint32](0x0001 -bor 0x0002 -bor 0x0040)) | Out-Null
            [HyperGetUiSmokeNative]::BringWindowToTop($windowHandle) | Out-Null
            [HyperGetUiSmokeNative]::SetForegroundWindow($windowHandle) | Out-Null
            Start-Sleep -Milliseconds 300
            if ([HyperGetUiSmokeNative]::GetForegroundWindow() -ne $windowHandle) {
              throw 'Installed GUI did not become foreground; refusing an obscured screenshot.'
            }
            $windowRect = [HyperGetUiSmokeNative+RECT]::new()
            if (-not [HyperGetUiSmokeNative]::GetWindowRect($windowHandle, [ref]$windowRect)) {
              throw 'Could not obtain installed GUI window bounds.'
            }
            $windowWidth = $windowRect.Right - $windowRect.Left
            $windowHeight = $windowRect.Bottom - $windowRect.Top
            if ($windowWidth -lt 200 -or $windowHeight -lt 150) {
              throw 'Installed GUI window bounds are too small for screenshot acceptance.'
            }
            $bitmap = [System.Drawing.Bitmap]::new($windowWidth, $windowHeight)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen(
                [System.Drawing.Point]::new($windowRect.Left, $windowRect.Top),
                [System.Drawing.Point]::Empty,
                [System.Drawing.Size]::new($windowWidth, $windowHeight)
              )
              $target = Join-Path $PWD 'build/ci-release/installed-gui-smoke.png'
              $bitmap.Save($target, [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "GUI screenshot: $target"

              # Exercise Ctrl+F against the REAL installed Windows UI. The
              # shortcut must focus the existing search box; a keypress-only
              # source assertion does not prove focus or typed input.
              Add-Type -AssemblyName System.Windows.Forms
              [HyperGetUiSmokeNative]::SetForegroundWindow($windowHandle) | Out-Null
              if ([HyperGetUiSmokeNative]::GetForegroundWindow() -ne $windowHandle) {
                throw 'Cannot focus installed HyperGet for Ctrl+F keyboard acceptance.'
              }
              [System.Windows.Forms.SendKeys]::SendWait('^f')
              Start-Sleep -Milliseconds 250
              [System.Windows.Forms.SendKeys]::SendWait('hgfocusprobe')
              Start-Sleep -Milliseconds 350
              if ([HyperGetUiSmokeNative]::GetForegroundWindow() -ne $windowHandle) {
                throw 'The installed HyperGet window lost focus during keyboard search acceptance.'
              }
              $searchScreenshot = Join-Path $PWD 'build/ci-release/installed-gui-ctrl-f-search.png'
              $searchBitmap = [System.Drawing.Bitmap]::new($windowWidth, $windowHeight)
              $searchGraphics = [System.Drawing.Graphics]::FromImage($searchBitmap)
              try {
                $searchGraphics.CopyFromScreen(
                  [System.Drawing.Point]::new($windowRect.Left, $windowRect.Top),
                  [System.Drawing.Point]::Empty,
                  [System.Drawing.Size]::new($windowWidth, $windowHeight)
                )
                $searchBitmap.Save($searchScreenshot, [System.Drawing.Imaging.ImageFormat]::Png)
                $changedTextPixels = 0
                # The actual 1040px Windows screenshot places Search at the
                # upper-right, between approx 67-85% width, y=10..40.
                # Compare ONLY glyph interior, not the focus border:
                # a focus ring by itself cannot satisfy the check.
                $xStart = [int]($windowWidth * 0.70)
                $xEnd = [int]($windowWidth * 0.83)
                for ($pixelY = 14; $pixelY -lt [Math]::Min($windowHeight, 33); $pixelY++) {
                  for ($pixelX = $xStart; $pixelX -lt $xEnd; $pixelX++) {
                    $before = $bitmap.GetPixel($pixelX, $pixelY)
                    $after = $searchBitmap.GetPixel($pixelX, $pixelY)
                    $diff = [Math]::Abs([int]$before.R - [int]$after.R) +
                      [Math]::Abs([int]$before.G - [int]$after.G) +
                      [Math]::Abs([int]$before.B - [int]$after.B)
                    if ($diff -ge 45) { $changedTextPixels++ }
                  }
                }
                if ($changedTextPixels -lt 85) {
                  # Diagnose keyboard injection independently: first click the
                  # visible search box with native mouse and then type text.
                  # The direct-click probe is NOT a substitute for Ctrl+F.
                  if (-not [HyperGetUiSmokeNative]::SetCursorPos(
                    ($windowRect.Left + [int]($windowWidth * 0.75)), ($windowRect.Top + 23)
                  )) { throw 'Could not position direct-click keyboard diagnostic.' }
                  [HyperGetUiSmokeNative]::mouse_event([uint32]2, 0, 0, 0, [UIntPtr]::Zero)
                  [HyperGetUiSmokeNative]::mouse_event([uint32]4, 0, 0, 0, [UIntPtr]::Zero)
                  [System.Windows.Forms.SendKeys]::SendWait('clickedprobe')
                  Start-Sleep -Milliseconds 300
                  $directBitmap = [System.Drawing.Bitmap]::new($windowWidth, $windowHeight)
                  $directGraphics = [System.Drawing.Graphics]::FromImage($directBitmap)
                  try {
                    $directGraphics.CopyFromScreen(
                      [System.Drawing.Point]::new($windowRect.Left, $windowRect.Top),
                      [System.Drawing.Point]::Empty,
                      [System.Drawing.Size]::new($windowWidth, $windowHeight)
                    )
                    $directBitmap.Save(
                      (Join-Path $PWD 'build/ci-release/installed-gui-direct-click-search-diagnostic.png'),
                      [System.Drawing.Imaging.ImageFormat]::Png
                    )
                    $directChangedPixels = 0
                    for ($y = 14; $y -lt [Math]::Min(33, $windowHeight); $y++) {
                      for ($x = $xStart; $x -lt $xEnd; $x++) {
                        $p = $bitmap.GetPixel($x, $y)
                        $q = $directBitmap.GetPixel($x, $y)
                        if (([Math]::Abs([int]$p.R - [int]$q.R) +
                          [Math]::Abs([int]$p.G - [int]$q.G) +
                          [Math]::Abs([int]$p.B - [int]$q.B)) -ge 45) {
                          $directChangedPixels++
                        }
                      }
                    }
                    throw "Ctrl+F search input did not change (glyph pixels=$changedTextPixels). Direct mouse-click + typing diagnostic changed=$directChangedPixels pixels."
                  } finally {
                    $directGraphics.Dispose()
                    $directBitmap.Dispose()
                  }
                }
                Write-Host "PASS: real Windows Ctrl+F focused Search; typed probe changed $changedTextPixels search glyph pixels."
              } finally {
                $searchGraphics.Dispose()
                $searchBitmap.Dispose()
                # Do not leave a synthetic search/filter in this runner.
                # Escape should clear the Home search AND return focus
                # to the download list, without affecting other text fields.
                [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
                Start-Sleep -Milliseconds 220
              }

              # Collect an actual process-tree CPU/RAM baseline while the
              # installed app is open and idle. This measures hardware behavior,
              # not the predicted effect of source-level animation changes.
              $metricsDir = Join-Path $PWD 'build/ci-release/idle-baseline-matrix'
              $sourceSha = (git rev-parse HEAD).Trim()
          $expectedSourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($sourceSha -ne $expectedSourceSha) {
            throw "Idle metrics source SHA mismatch: checked out $sourceSha, expected $expectedSourceSha"
          }
          Write-Host "Idle metrics source SHA: $sourceSha"
          & ./scripts/Run-WindowsIdleBenchmarkMatrix.ps1 -RootProcessName HyperGet -SourceSha $sourceSha -OutputDirectory $metricsDir -Rounds 3 -DurationSeconds 20
              if ((@(Get-ChildItem -LiteralPath $metricsDir -Filter '*.csv' -File)).Count -ne 6) {
                throw 'Idle/minimized benchmark matrix did not produce all six CSVs.'
              }
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          } finally {
            $visible | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
            if ($started -and -not $started.HasExited) {
              Stop-Process -Id $started.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Diagnose native Windows two-file OLE mouse drag
        # Separate diagnostic: a hosted desktop may not support OLE mouse
        # injection reliably. Do not misreport a failure as feature acceptance.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = (git rev-parse HEAD).Trim()
          & ./scripts/Run-WindowsMultiFileDropE2E.ps1 -GuiExecutable $env:IDM_SMOKE_EXECUTABLE -SourceSha $sourceSha -OutputDirectory (Join-Path $PWD 'build/ci-release/native-drop')

      - name: Upload native two-file Windows drag diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-two-file-drag
          path: build/ci-release/native-drop/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real Liquid Progress while an installed download is active
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'build/ci-release/liquid-progress-visual'
          $sourceSha = (git rev-parse HEAD).Trim()
          & ./scripts/Run-WindowsLiquidProgressVisualE2E.ps1 -GuiExecutable $env:IDM_SMOKE_EXECUTABLE -CliExecutable $env:IDM_SMOKE_CLI -SourceSha $sourceSha -OutputDirectory $output

      - name: Verify isolated NSIS same-version reinstall and silent uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $PWD 'build/ci-release/binaries'
          $installer = @(Get-ChildItem -LiteralPath $packages -File -Filter '*.exe' -Recurse)
          if ($installer.Count -ne 1) { throw 'No unique installer for lifecycle acceptance.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'idm-smoke'
          $proof = Join-Path $PWD 'build/ci-release/windows-installer-lifecycle.txt'
          $sourceSha = (git rev-parse HEAD).Trim()
          $expectedSourceSha = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($sourceSha -ne $expectedSourceSha) {
            throw "Wrong source SHA for installer lifecycle proof: checked out $sourceSha, expected $expectedSourceSha"
          }
          & ./scripts/Run-WindowsInstallerLifecycleE2E.ps1 -InstallerExecutable $installer[0].FullName -InstallDirectory $installDir -SourceSha $sourceSha -ProofFile $proof
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) {
            throw 'Installer lifecycle acceptance proof was not written.'
          }

      - name: Upload exact-SHA verified Windows NSIS installer for user testing
        # Only publish a candidate when *all* preceding source, Kotlin, GUI,
        # live HTTP/SHA256, restart and installer lifecycle steps passed.
        # One EXE is enforced by the earlier installed-GUI acceptance step.
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-windows-verified-installer
          path: build/ci-release/binaries/**/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload active Liquid Progress screenshot and verified transfer report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-liquid-progress-visual
          path: build/ci-release/liquid-progress-visual/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload real Windows reinstall/uninstall acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-lifecycle
          path: build/ci-release/windows-installer-lifecycle.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload actual installed-app idle CPU/RAM baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-idle-process-metrics
          path: build/ci-release/idle-baseline-matrix/*.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installed GUI screenshot when available
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-gui-smoke
          path: |
            build/ci-release/installed-gui-smoke.png
            build/ci-release/installed-gui-ctrl-f-search.png
            build/ci-release/installed-gui-direct-click-search-diagnostic.png
          if-no-files-found: ignore
          retention-days: 7
