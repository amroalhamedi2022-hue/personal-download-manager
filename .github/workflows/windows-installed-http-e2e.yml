name: Windows installed HTTP real network E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-http-e2e.yml"
      - "scripts/Run-WindowsInstalledResumeE2E.ps1"
      - "scripts/Wait-WindowsLoopbackHttpPort.ps1"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/connection/Connection.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/connection/OkHttpHttpDownloaderClient.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/part/PartDownloaderIoLifecycleTest.kt"
      - "scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py"
      - "scripts/source-tests/test_hyperget_http_fixture_port_readiness.py"
      - "scripts/LocalHttpRangeFixture.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/build.gradle.kts"
      - "desktop/app/icons/icon.ico"
      - "desktop/app/icons/hyperget-icon.svg"
      - "buildSrc/src/main/kotlin/buildlogic/versioning/VersionUtil.kt"
      - "scripts/source-tests/test_hyperget_executable_identity_workflows.py"
  push:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-http-e2e.yml"
      - "scripts/Run-WindowsInstalledResumeE2E.ps1"
      - "scripts/Wait-WindowsLoopbackHttpPort.ps1"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/connection/Connection.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/connection/OkHttpHttpDownloaderClient.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/part/PartDownloaderIoLifecycleTest.kt"
      - "scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py"
      - "scripts/source-tests/test_hyperget_http_fixture_port_readiness.py"
      - "scripts/LocalHttpRangeFixture.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/build.gradle.kts"
      - "desktop/app/icons/icon.ico"
      - "desktop/app/icons/hyperget-icon.svg"
      - "buildSrc/src/main/kotlin/buildlogic/versioning/VersionUtil.kt"
      - "scripts/source-tests/test_hyperget_executable_identity_workflows.py"

permissions:
  contents: read

jobs:
  install-download-verify:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:HYPERGET_TESTED_SHA) { throw 'HTTP E2E checked out the wrong source SHA.' }
      - name: Parse HTTP fixture helper and Pause/Resume harness before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($scriptPath in @('scripts/Wait-WindowsLoopbackHttpPort.ps1', 'scripts/Run-WindowsInstalledResumeE2E.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $scriptPath).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed for $scriptPath : $($parseErrors -join '; ')" }
            Write-Host "PowerShell syntax PASS: $scriptPath"
          }
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one Windows installer
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi
      - name: Install and download 16 MiB with actual GUI process and CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $PWD 'scripts/Wait-WindowsLoopbackHttpPort.ps1')
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -Filter '*.exe' -Recurse -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $root = Join-Path $env:RUNNER_TEMP 'installed-http-e2e'
          $appDir = Join-Path $root 'application'
          $downloadDir = Join-Path $root 'downloaded'
          $fixtureDir = Join-Path $root 'fixture'
          New-Item -ItemType Directory -Path $root,$downloadDir,$fixtureDir -Force | Out-Null
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$appDir") -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent installer timed out'
          }
          if ($installer.ExitCode -ne 0) { throw "Installer exit=$($installer.ExitCode)" }
          if (@(Get-Process -Name 'DownloadManager','HyperGet' -ErrorAction SilentlyContinue).Count -ne 0) { throw 'Silent HTTP installer unexpectedly launched a GUI.' }
          $exe = @(Get-ChildItem -LiteralPath $appDir -Filter '*.exe' -Recurse -File)
          $gui = @($exe | Where-Object { $_.BaseName -eq 'HyperGet' })
          $legacyGui = @($exe | Where-Object { $_.BaseName -eq 'DownloadManager' })
          $cli = @($exe | Where-Object { $_.BaseName -eq 'DownloadManagerCli' })
          if ($gui.Count -ne 1 -or $legacyGui.Count -ne 0 -or $cli.Count -ne 1) {
            throw "Expected one HyperGet GUI, no legacy GUI, and one stable CLI: HyperGet=$($gui.Count), legacy=$($legacyGui.Count), CLI=$($cli.Count)"
          }
          $fixture = Join-Path $fixtureDir 'fixture.bin'
          & python -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(bytes(range(256))*65536)' $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create deterministic 16 MiB HTTP fixture.' }
          $expectedSha = (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
          $portPath = Join-Path $fixtureDir 'port.txt'
          $server = Start-Process -FilePath python -ArgumentList @('scripts/LocalHttpRangeFixture.py','--file',$fixture,'--port-file',$portPath,'--chunk-delay-ms','15') -PassThru -RedirectStandardOutput (Join-Path $fixtureDir 'server-stdout.txt') -RedirectStandardError (Join-Path $fixtureDir 'server-stderr.txt')
          $guiProcess = $null
          try {
            $port = Wait-HyperGetLoopbackHttpPort -PortFile $portPath -Server $server -FixtureName 'Installed HTTP E2E fixture' -Attempts 40 -ServerErrorPath (Join-Path $fixtureDir 'server-stderr.txt')
            $url = "http://127.0.0.1:$port/fixture.bin"
            $parsedLoopbackUrl = [System.Uri]::new($url, [System.UriKind]::Absolute)
            if ($parsedLoopbackUrl.Scheme -ne 'http' -or -not $parsedLoopbackUrl.IsLoopback -or $parsedLoopbackUrl.Port -ne $port) {
              throw 'Installed HTTP E2E fixture URL failed loopback preflight.'
            }
            Write-Host "Installed HTTP E2E loopback endpoint validated on port $port."
            $guiProcess = Start-Process -FilePath $gui.FullName -PassThru
            Start-Sleep -Seconds 5
            $output = & $cli.FullName download add http --link $url --folder $downloadDir --name 'installed-e2e.bin' --start 2>&1
            $status = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($status -ne 0) { throw "Desktop CLI returned exit=$status" }
            $download = Join-Path $downloadDir 'installed-e2e.bin'
            $success = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Test-Path -LiteralPath $download) -and (Get-Item -LiteralPath $download).Length -eq 16777216) {
                # Full size is NOT proof the downloader closed the destination.
                # Wait out transient Windows sharing violations, then compare
                # all bytes; do not accept a missing/partial/wrong hash.
                try {
                  $actualHash = (Get-FileHash -LiteralPath $download -Algorithm SHA256 -ErrorAction Stop).Hash
                  if ($actualHash -eq $expectedSha) {
                    $success = $true
                    break
                  }
                } catch {
                  Write-Host 'Completed-size file is not yet readable; retrying SHA256 after the download closes it.'
                }
              }
            }
            if (-not $success) { throw 'Installed HTTP task failed byte-for-byte SHA256 verification.' }
            # Verify the finished output remains byte-identical after the
            # desktop task reports completion; this catches late writes.
            Start-Sleep -Seconds 2
            if ((Get-Item -LiteralPath $download).Length -ne 16777216) {
              throw 'Installed HTTP output length changed after completion.'
            }
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expectedSha) {
              throw 'Installed HTTP output SHA256 changed after completion.'
            }
            New-Item -ItemType Directory -Path 'build/ci-release' -Force | Out-Null
            "SourceSha=$env:HYPERGET_TESTED_SHA" | Set-Content 'build/ci-release/installed-http-e2e.txt'
            "ExpectedSHA256=$expectedSha" | Add-Content 'build/ci-release/installed-http-e2e.txt'
            "ActualSHA256=$((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash)" | Add-Content 'build/ci-release/installed-http-e2e.txt'
            Write-Host 'Real installed Windows HTTP transfer passed: 16 MiB exact SHA256.'
          } finally {
            if ($guiProcess -and -not $guiProcess.HasExited) {
              Stop-Process -Id $guiProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Verify real installed HTTP Pause, socket shutdown, Resume and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Join-Path $env:RUNNER_TEMP 'installed-http-e2e/application'
          $gui = Join-Path $installed 'HyperGet.exe'
          $cli = Join-Path $installed 'DownloadManagerCli.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf) -or -not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw 'Installed GUI or CLI is missing before Pause/Resume check.'
          }
          & ./scripts/Run-WindowsInstalledResumeE2E.ps1 -GuiExecutable $gui -CliExecutable $cli -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'installed-resume-e2e')
          $proof = Join-Path $env:RUNNER_TEMP 'installed-resume-e2e/resume-evidence.txt'
          if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) { throw 'Resume proof missing.' }
          Copy-Item -LiteralPath $proof -Destination 'build/ci-release/installed-resume-e2e.txt'

      - name: Upload installed HTTP E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-http-e2e
          path: |
            build/ci-release/installed-http-e2e.txt
            build/ci-release/installed-resume-e2e.txt
          if-no-files-found: ignore
          retention-days: 7
