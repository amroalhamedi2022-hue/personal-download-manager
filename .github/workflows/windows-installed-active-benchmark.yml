name: Windows installed active HTTP 1-4-16 benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-active-benchmark.yml"
      - "scripts/Run-WindowsActiveBenchmarkMatrix.ps1"
      - "scripts/LocalHttpRangeFixture.py"
      - "scripts/test_local_http_range_fixture.py"
  push:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-active-benchmark.yml"
      - "scripts/Run-WindowsActiveBenchmarkMatrix.ps1"
      - "scripts/Summarize-WindowsActiveBenchmark.ps1"
      - "scripts/Measure-WindowsDownloadManager.ps1"
      - "scripts/LocalHttpRangeFixture.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/settings/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/**"

permissions:
  contents: read

concurrency:
  group: windows-installed-active-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-windows-active-transfers:
    name: Install once; 63 SHA256-verified downloads and 9 real CPU/RAM runs
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preflight exact PR head and per-scenario cap contracts (no compile)
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:HYPERGET_TESTED_SHA) { throw "Wrong checkout: $actual" }
          python -m unittest discover -s scripts/source-tests -p test_hyperget_active_benchmark_source.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/test_local_http_range_fixture.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exactly one NSIS Windows installer
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install real GUI and CLI into clean isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, got $($installers.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP 'idm-active-benchmark-installed'
          if (Test-Path -LiteralPath $installDir) { throw 'Benchmark install directory unexpectedly exists.' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw 'Real Windows installer timed out.'
          }
          if ($installer.ExitCode -ne 0) { throw "Installer exit code $($installer.ExitCode)." }
          Start-Sleep -Seconds 2
          if (@(Get-Process -Name 'DownloadManager' -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'Silent installer unexpectedly launched an extra GUI process.'
          }
          $exe = @(Get-ChildItem -LiteralPath $installDir -File -Recurse -Filter '*.exe')
          $gui = @($exe | Where-Object { $_.BaseName -eq 'DownloadManager' })
          $cli = @($exe | Where-Object { $_.BaseName -match 'DownloadManagerCli$' })
          if ($gui.Count -ne 1 -or $cli.Count -ne 1) {
            throw "Expected one installed GUI and CLI: GUI=$($gui.Count), CLI=$($cli.Count)"
          }
          "IDM_BENCH_GUI=$($gui[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IDM_BENCH_CLI=$($cli[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $digest = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installed NSIS installer SHA256: $digest"

      - name: Measure 1 / 4 / 16 simultaneous real installed Windows transfers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Run-WindowsActiveBenchmarkMatrix.ps1 -GuiExecutable $env:IDM_BENCH_GUI -CliExecutable $env:IDM_BENCH_CLI -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/active-transfer-bench' -Rounds 3 -SampleSeconds 8 -FileSizeMiB 32 -ServerChunkDelayMs 500 -CompletionTimeoutSeconds 300

      - name: Audit hashes, concurrent requests, process samples, and render report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Summarize-WindowsActiveBenchmark.ps1 -Directory 'build/ci-release/active-transfer-bench' -SourceSha $env:HYPERGET_TESTED_SHA -Rounds 3
          $report = 'build/ci-release/active-transfer-bench/benchmark-report.md'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Verified report missing' }
          Get-Content -LiteralPath $report

      - name: Upload reproducible Windows metrics and SHA-verified task manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-active-http-1-4-16-evidence
          path: |
            build/ci-release/active-transfer-bench/measurements/*.csv
            build/ci-release/active-transfer-bench/verified-transfers.csv
            build/ci-release/active-transfer-bench/round-summary.csv
            build/ci-release/active-transfer-bench/benchmark-report.md
            build/ci-release/active-transfer-bench/failure-diagnostics.txt
            build/ci-release/active-transfer-bench/server-stderr.txt
          if-no-files-found: warn
          retention-days: 7
