name: Windows installed active HTTP 1-4-16 benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-active-benchmark.yml"
      - "docs/checkpoints/HG_E060_ACTIVE_PERFORMANCE_RECHECK.md"
      - "scripts/Run-WindowsControlledBenchmarkComparison.ps1"
      - "scripts/Compare-WindowsActiveBenchmarks.ps1"
      - "scripts/Measure-WindowsDownloadManager.ps1"
      - "scripts/Summarize-WindowsActiveBenchmark.ps1"
      - "scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py"
      - "scripts/Run-WindowsActiveBenchmarkMatrix.ps1"
      - "scripts/LocalHttpRangeFixture.py"
      - "scripts/test_local_http_range_fixture.py"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/part/PartDownloader.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/part/PartResponseDeadlineTest.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt"
      - "shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/TimeUtil.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt"
  push:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-active-benchmark.yml"
      - "scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py"
      - "scripts/Run-WindowsActiveBenchmarkMatrix.ps1"
      - "scripts/Summarize-WindowsActiveBenchmark.ps1"
      - "scripts/Measure-WindowsDownloadManager.ps1"
      - "scripts/LocalHttpRangeFixture.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/settings/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt"
      - "shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/TimeUtil.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt"

permissions:
  contents: read

concurrency:
  # Preserve an already-running evidence round; unrelated PR commits are gated below.
  group: windows-installed-active-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  change-scope:
    name: Skip Windows transfer matrix for unrelated PR commits
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
      comparison: ${{ steps.scope.outputs.comparison }}
    steps:
      - name: Check out exact PR head and its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Latest commit changed files:\\n%s\\n' "$changed"
          run=false
          comparison=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/windows-installed-active-benchmark.yml|docs/checkpoints/HG_E060_ACTIVE_PERFORMANCE_RECHECK.md|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/TimeUtil.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt|scripts/Run-WindowsActiveBenchmarkMatrix.ps1|scripts/LocalHttpRangeFixture.py|scripts/test_local_http_range_fixture.py|scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py|downloader/core/src/commonMain/kotlin/ir/amirab/downloader/part/PartDownloader.kt|downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/part/PartResponseDeadlineTest.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/settings/*|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/*|scripts/Run-WindowsControlledBenchmarkComparison.ps1|scripts/Compare-WindowsActiveBenchmarks.ps1|scripts/Measure-WindowsDownloadManager.ps1|scripts/Summarize-WindowsActiveBenchmark.ps1)
                run=true
                ;;
            esac
            case "$file" in
              .github/workflows/windows-installed-active-benchmark.yml|scripts/Run-WindowsControlledBenchmarkComparison.ps1|scripts/Compare-WindowsActiveBenchmarks.ps1|scripts/Run-WindowsActiveBenchmarkMatrix.ps1|scripts/Measure-WindowsDownloadManager.ps1|scripts/Summarize-WindowsActiveBenchmark.ps1)
                comparison=true
                run=true
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "comparison=$comparison" >> "$GITHUB_OUTPUT"

  real-windows-active-transfers:
    needs: change-scope
    if: needs.change-scope.outputs.run == 'true' && needs.change-scope.outputs.comparison != 'true'
    name: Install once; 63 SHA256-verified downloads and 9 real CPU/RAM runs
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preflight exact PR head and per-scenario cap contracts (no compile)
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:HYPERGET_TESTED_SHA) { throw "Wrong checkout: $actual" }
          python -m unittest discover -s scripts/source-tests -p test_hyperget_active_benchmark_source.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/test_local_http_range_fixture.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exactly one NSIS Windows installer
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install real GUI and CLI into clean isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, got $($installers.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP 'idm-active-benchmark-installed'
          if (Test-Path -LiteralPath $installDir) { throw 'Benchmark install directory unexpectedly exists.' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw 'Real Windows installer timed out.'
          }
          if ($installer.ExitCode -ne 0) { throw "Installer exit code $($installer.ExitCode)." }
          Start-Sleep -Seconds 2
          if (@(Get-Process -Name 'DownloadManager' -ErrorAction SilentlyContinue).Count -ne 0) {
            throw 'Silent installer unexpectedly launched an extra GUI process.'
          }
          $exe = @(Get-ChildItem -LiteralPath $installDir -File -Recurse -Filter '*.exe')
          $gui = @($exe | Where-Object { $_.BaseName -eq 'DownloadManager' })
          $cli = @($exe | Where-Object { $_.BaseName -match 'DownloadManagerCli$' })
          if ($gui.Count -ne 1 -or $cli.Count -ne 1) {
            throw "Expected one installed GUI and CLI: GUI=$($gui.Count), CLI=$($cli.Count)"
          }
          "IDM_BENCH_GUI=$($gui[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IDM_BENCH_CLI=$($cli[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $digest = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installed NSIS installer SHA256: $digest"

      - name: Measure 1 / 4 / 16 simultaneous real installed Windows transfers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Run-WindowsActiveBenchmarkMatrix.ps1 -GuiExecutable $env:IDM_BENCH_GUI -CliExecutable $env:IDM_BENCH_CLI -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/active-transfer-bench' -Rounds 3 -SampleSeconds 8 -FileSizeMiB 32 -ServerChunkDelayMs 500 -CompletionTimeoutSeconds 300

      - name: Audit hashes, concurrent requests, process samples, and render report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Summarize-WindowsActiveBenchmark.ps1 -Directory 'build/ci-release/active-transfer-bench' -SourceSha $env:HYPERGET_TESTED_SHA -Rounds 3
          $report = 'build/ci-release/active-transfer-bench/benchmark-report.md'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Verified report missing' }
          Get-Content -LiteralPath $report

      - name: Upload reproducible Windows metrics and SHA-verified task manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-active-http-1-4-16-evidence
          path: |
            build/ci-release/active-transfer-bench/measurements/*.csv
            build/ci-release/active-transfer-bench/verified-transfers.csv
            build/ci-release/active-transfer-bench/round-summary.csv
            build/ci-release/active-transfer-bench/benchmark-report.md
            build/ci-release/active-transfer-bench/failure-diagnostics.txt
            build/ci-release/active-transfer-bench/server-stderr.txt
          if-no-files-found: warn
          retention-days: 7

  controlled-baseline-candidate-comparison:
    needs: change-scope
    if: needs.change-scope.outputs.comparison == 'true'
    name: Paired exact-snapshot HTTP throughput and memory regression check
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_BASELINE_SHA: d6ea54a885277cb5b8fd545eb3f3fb0e185b6aa5
      HYPERGET_CANDIDATE_SHA: c99b6f627de5f1ef1cba9e79f4f8e1baba20ffe1
      HYPERGET_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out current harness at the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out exact baseline app snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HYPERGET_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate app snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HYPERGET_CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify exact app and harness snapshots; run source contracts before builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (git -C baseline rev-parse HEAD).Trim()
          $candidate = (git -C candidate rev-parse HEAD).Trim()
          $harness = (git -C harness rev-parse HEAD).Trim()
          if ($baseline -ne $env:HYPERGET_BASELINE_SHA) { throw "Unexpected baseline checkout: $baseline" }
          if ($candidate -ne $env:HYPERGET_CANDIDATE_SHA) { throw "Unexpected candidate checkout: $candidate" }
          if ($harness -ne $env:HYPERGET_HARNESS_SHA) { throw "Unexpected harness checkout: $harness" }
          $psFiles = @(
            'harness/scripts/Run-WindowsActiveBenchmarkMatrix.ps1',
            'harness/scripts/Measure-WindowsDownloadManager.ps1',
            'harness/scripts/Summarize-WindowsActiveBenchmark.ps1',
            'harness/scripts/Run-WindowsControlledBenchmarkComparison.ps1',
            'harness/scripts/Compare-WindowsActiveBenchmarks.ps1'
          )
          foreach ($psFile in $psFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $psFile).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "$($psFile):$($_.Extent.StartLineNumber):$($_.Message)" }
              throw "PowerShell parser rejected $psFile."
            }
          }
          Write-Host 'PASS: all benchmark PowerShell scripts parse before any build.'
          python harness/scripts/source-tests/test_hyperget_controlled_benchmark_source.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Controlled benchmark source contracts failed before build.' }
          $out = 'harness/build/ci-release/controlled-comparison'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "HYPERGET_COMPARISON_OUTPUT=$((Resolve-Path $out).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds') -Force | Out-Null
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
      - name: Build baseline installer from exact pre-bound source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location baseline
          try {
            & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict createReleaseFolderForCi
            if ($LASTEXITCODE -ne 0) { throw "Baseline Gradle packaging failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $files = @(Get-ChildItem -LiteralPath 'baseline/build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one baseline NSIS installer; found $($files.Count)." }
          $dest = Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds/baseline-installer.exe'
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest -Force
          Write-Host "Baseline installer SHA256: $((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant())"
          "HYPERGET_BASELINE_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build candidate installer from exact bounded-copy source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location candidate
          try {
            & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict createReleaseFolderForCi
            if ($LASTEXITCODE -ne 0) { throw "Candidate Gradle packaging failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $files = @(Get-ChildItem -LiteralPath 'candidate/build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one candidate NSIS installer; found $($files.Count)." }
          $dest = Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds/candidate-installer.exe'
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest -Force
          Write-Host "Candidate installer SHA256: $((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant())"
          "HYPERGET_CANDIDATE_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run paired alternating 1/4/16 installed Windows measurements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./harness/scripts/Run-WindowsControlledBenchmarkComparison.ps1 -BaselineInstaller $env:HYPERGET_BASELINE_INSTALLER -CandidateInstaller $env:HYPERGET_CANDIDATE_INSTALLER -BaselineSourceSha $env:HYPERGET_BASELINE_SHA -CandidateSourceSha $env:HYPERGET_CANDIDATE_SHA -HarnessSha $env:HYPERGET_HARNESS_SHA -OutputDirectory $env:HYPERGET_COMPARISON_OUTPUT -Rounds 3
      - name: Upload paired Windows metrics and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-controlled-http-performance-comparison
          path: |
            harness/build/ci-release/controlled-comparison/**
          if-no-files-found: warn
          retention-days: 14
