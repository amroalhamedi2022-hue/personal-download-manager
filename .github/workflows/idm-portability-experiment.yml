name: IDM official Windows experiment
on:
  push:
    branches:
      - experiment/idm-windows-portability-20261116
permissions:
  contents: read
jobs:
  verify-install-and-export:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer and build private encrypted ZIP
        shell: pwsh
        env:
          IDM_PUBLIC_KEY_DER_B64: 
        run: ./tools/idm_portability_experiment.ps1
      - name: Upload encrypted archive and test report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-experiment-encrypted
          path: encrypted_result/
          if-no-files-found: warn
          retention-days: 1
