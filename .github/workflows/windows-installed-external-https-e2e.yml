name: HyperGet installed external HTTPS and Range acceptance

on:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-external-https-e2e.yml"
      - "scripts/Run-WindowsExternalHttpsE2E.ps1"
      - "scripts/source-tests/test_hyperget_external_https_e2e.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/build.gradle.kts"
      - "desktop/app/icons/icon.ico"
      - "desktop/app/icons/hyperget-icon.svg"

concurrency:
  group: hyperget-external-https-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external-https:
    name: Install exact PR SHA; external HTTPS Range + SHA-256
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact PR head (not synthetic merge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:HYPERGET_TESTED_SHA) {
            throw "External HTTPS E2E checked out $actual, expected $env:HYPERGET_TESTED_SHA."
          }

      - name: Run source acceptance contract before build
        shell: bash
        run: python -m unittest discover -s scripts/source-tests -p test_hyperget_external_https_e2e.py -v

      - name: Parse PowerShell harness before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/Run-WindowsExternalHttpsE2E.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed for $path : $($parseErrors -join '; ')" }
          Write-Host "PowerShell syntax PASS: $path"

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one Windows installer for the external endpoint test
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install HyperGet and test external HTTPS Range + exact bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -Filter '*.exe' -Recurse -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one test installer, found $($installers.Count)." }
          & ./scripts/Run-WindowsExternalHttpsE2E.ps1 -InstallerPath $installers[0].FullName -OutputDirectory 'build/ci-release/external-https-e2e' -SourceSha $env:HYPERGET_TESTED_SHA

      - name: Upload sanitized external HTTPS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyperget-external-https-e2e
          path: build/ci-release/external-https-e2e/external-https-e2e.txt
          if-no-files-found: warn
          retention-days: 7
