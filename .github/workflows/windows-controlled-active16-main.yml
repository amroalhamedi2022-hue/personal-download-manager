name: HyperGet controlled Windows 16-active memory and throughput gate

on:
  workflow_dispatch:
  push:
    branches: [test/installed-windows-active16-benchmark-20261106]
    paths:
      - ".github/workflows/windows-controlled-active16-main.yml"
      - "scripts/Run-WindowsControlledBenchmarkComparison.ps1"
      - "scripts/Compare-WindowsActiveBenchmarks.ps1"

permissions:
  contents: read

concurrency:
  group: windows-controlled-active16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-baseline-candidate-comparison:
    name: Paired exact-snapshot HTTP throughput and memory regression check
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_BASELINE_SHA: d6ea54a885277cb5b8fd545eb3f3fb0e185b6aa5
      HYPERGET_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HYPERGET_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out current harness at the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out exact baseline app snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HYPERGET_BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate app snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HYPERGET_CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify exact app and harness snapshots; run source contracts before builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (git -C baseline rev-parse HEAD).Trim()
          $candidate = (git -C candidate rev-parse HEAD).Trim()
          $harness = (git -C harness rev-parse HEAD).Trim()
          if ($baseline -ne $env:HYPERGET_BASELINE_SHA) { throw "Unexpected baseline checkout: $baseline" }
          if ($candidate -ne $env:HYPERGET_CANDIDATE_SHA) { throw "Unexpected candidate checkout: $candidate" }
          if ($harness -ne $env:HYPERGET_HARNESS_SHA) { throw "Unexpected harness checkout: $harness" }
          $psFiles = @(
            'harness/scripts/Run-WindowsActiveBenchmarkMatrix.ps1',
            'harness/scripts/Measure-WindowsDownloadManager.ps1',
            'harness/scripts/Summarize-WindowsActiveBenchmark.ps1',
            'harness/scripts/Run-WindowsControlledBenchmarkComparison.ps1',
            'harness/scripts/Compare-WindowsActiveBenchmarks.ps1'
          )
          foreach ($psFile in $psFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $psFile).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "$($psFile):$($_.Extent.StartLineNumber):$($_.Message)" }
              throw "PowerShell parser rejected $psFile."
            }
          }
          Write-Host 'PASS: all benchmark PowerShell scripts parse before any build.'
          Push-Location harness
          try {
            python -m unittest scripts/test_local_http_range_fixture.py -v
            if ($LASTEXITCODE -ne 0) { throw 'HTTP Range fixture regressions failed before build.' }
          } finally { Pop-Location }
          $out = 'harness/build/ci-release/controlled-comparison'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "HYPERGET_COMPARISON_OUTPUT=$((Resolve-Path $out).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds') -Force | Out-Null
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
      - name: Build baseline installer from exact pre-bound source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location baseline
          try {
            & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict createReleaseFolderForCi
            if ($LASTEXITCODE -ne 0) { throw "Baseline Gradle packaging failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $files = @(Get-ChildItem -LiteralPath 'baseline/build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one baseline NSIS installer; found $($files.Count)." }
          $dest = Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds/baseline-installer.exe'
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest -Force
          Write-Host "Baseline installer SHA256: $((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant())"
          "HYPERGET_BASELINE_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build candidate installer from exact PR-head source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location candidate
          try {
            & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict createReleaseFolderForCi
            if ($LASTEXITCODE -ne 0) { throw "Candidate Gradle packaging failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $files = @(Get-ChildItem -LiteralPath 'candidate/build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one candidate NSIS installer; found $($files.Count)." }
          $dest = Join-Path $env:RUNNER_TEMP 'hyperget-controlled-comparison-builds/candidate-installer.exe'
          Copy-Item -LiteralPath $files[0].FullName -Destination $dest -Force
          Write-Host "Candidate installer SHA256: $((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant())"
          "HYPERGET_CANDIDATE_INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run paired alternating 1/4/16 installed Windows measurements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./harness/scripts/Run-WindowsControlledBenchmarkComparison.ps1 -BaselineInstaller $env:HYPERGET_BASELINE_INSTALLER -CandidateInstaller $env:HYPERGET_CANDIDATE_INSTALLER -BaselineSourceSha $env:HYPERGET_BASELINE_SHA -CandidateSourceSha $env:HYPERGET_CANDIDATE_SHA -HarnessSha $env:HYPERGET_HARNESS_SHA -OutputDirectory $env:HYPERGET_COMPARISON_OUTPUT -Rounds 3
            if ($LASTEXITCODE -ne 0) { throw "Controlled benchmark exited with code $LASTEXITCODE." }
          } catch {
            $message = $_.Exception.Message
            $annotation = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Controlled benchmark failure::$annotation"
            $report = Join-Path $env:HYPERGET_COMPARISON_OUTPUT 'comparison-report.md'
            if (Test-Path -LiteralPath $report -PathType Leaf) {
              Get-Content -LiteralPath $report | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
            $transcript = Join-Path $env:HYPERGET_COMPARISON_OUTPUT 'controlled-comparison-transcript.txt'
            if (Test-Path -LiteralPath $transcript -PathType Leaf) {
              Write-Host '--- controlled benchmark transcript tail ---'
              Get-Content -LiteralPath $transcript -Tail 200
            }
            throw
          }
      - name: Upload paired Windows metrics and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-controlled-http-performance-comparison
          path: |
            harness/build/ci-release/controlled-comparison/**
          if-no-files-found: warn
          retention-days: 14
