name: HyperGet source-only safety checks (NO APP BUILD)

# Deliberately separate from Windows validation and installer packaging.
# PR-triggered only to avoid duplicate push + PR runner minutes.
# This workflow uses only Python stdlib and never invokes Gradle, Compose,
# NSIS, MSI, EXE packaging, application compilation or artifact upload.
on:
  pull_request:
    branches:
      - codex/repair-rf00-rf01
    paths:
      - ".github/workflows/hyperget-source-only.yml"
      - "downloader/core/src/desktopMain/kotlin/ir/amirab/downloader/ftp/**"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/**"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/destination/**"
      - "scripts/source-tests/HyperGetHlsStagedSegmentSmoke.kt"
      - "scripts/source-tests/test_hyperget_hls_resume_source.py"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/**"
      - "scripts/source-tests/HyperGetHlsReconciliationSmoke.kt"
      - "scripts/source-tests/test_hyperget_hls_playlist_source.py"
      - "scripts/source-tests/HyperGetHlsBodyReaderSmoke.kt"
      - "scripts/source-tests/test_hyperget_hls_body_source.py"
      - "scripts/source-tests/HyperGetHlsContentTypeSmoke.kt"
      - "scripts/source-tests/test_hyperget_hls_mime_source.py"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/ftp/FtpStagedIdentityTest.kt"
      - "scripts/source-tests/test_hyperget_ftp_stage_source.py"
      - "scripts/test_local_ftp_fixture.py"
      - "scripts/LocalFtpFixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    name: Python source contracts and local FTP fixture (no binaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify FTP stage source contract
        run: python3 -m unittest discover -s scripts/source-tests -p test_hyperget_ftp_stage_source.py -v
      - name: Verify HLS playlist refresh source contract
        run: python3 -m unittest discover -s scripts/source-tests -p test_hyperget_hls_playlist_source.py -v
      - name: Verify HLS persisted completion and staged-file source contract
        run: python3 -m unittest discover -s scripts/source-tests -p test_hyperget_hls_resume_source.py -v
      - name: Verify bounded HLS playlist body source contract
        run: python3 -m unittest discover -s scripts/source-tests -p test_hyperget_hls_body_source.py -v
      - name: Verify HLS MIME source contract
        run: python3 -m unittest discover -s scripts/source-tests -p test_hyperget_hls_mime_source.py -v
      - name: Verify local FTP fixture protocol
        run: python3 -m unittest scripts/test_local_ftp_fixture.py -v
