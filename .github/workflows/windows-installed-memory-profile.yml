name: HyperGet installed Windows JVM memory profile

# Diagnostic milestone: one clean install, one 1/4/16 round, then inspect JVM
# heap/classes/threads. This is not the final release build and is not a speed claim.
on:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-memory-profile.yml"
      - "scripts/Collect-WindowsJvmMemoryProfile.ps1"
      - "scripts/Run-WindowsActiveBenchmarkMatrix.ps1"
      - "scripts/Summarize-WindowsActiveBenchmark.ps1"
      - "scripts/Measure-WindowsDownloadManager.ps1"
      - "scripts/LocalHttpRangeFixture.py"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt"
      - "shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/TimeUtil.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperget-memory-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Check out exact PR head and its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf 'Latest commit changed files:\\n%s\\n' "$changed"
          run=false
          while IFS= read -r file; do
            case "$file" in
              scripts/Collect-WindowsJvmMemoryProfile.ps1|scripts/Run-WindowsActiveBenchmarkMatrix.ps1|scripts/Summarize-WindowsActiveBenchmark.ps1|scripts/Measure-WindowsDownloadManager.ps1|scripts/LocalHttpRangeFixture.py|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/di/Di.kt|desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/home/sections/TableDownloadItem.kt|shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/util/TimeUtil.kt)
                run=true
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  installed-jvm-profile:
    needs: change-scope
    if: needs.change-scope.outputs.run == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JetBrains Runtime 25 for build and jcmd
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact SHA and parse PowerShell before build
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:HYPERGET_TESTED_SHA) { throw 'Wrong source SHA' }
          foreach ($path in @('scripts/Run-WindowsActiveBenchmarkMatrix.ps1','scripts/Collect-WindowsJvmMemoryProfile.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host $_.ToString() }; throw "PowerShell parse failed: $path" }
          }
          python -m unittest scripts/source-tests/test_hyperget_http_dispatcher_bound_source.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/source-tests/test_hyperget_memory_profile_source.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build exactly one internal Windows NSIS installer
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install GUI and CLI in a clean isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, got $($installers.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP 'hyperget-memory-profile-installed'
          if (Test-Path -LiteralPath $installDir) { throw 'Profile install directory unexpectedly exists.' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(180000)) { Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue; throw 'Installer timed out.' }
          if ($installer.ExitCode -ne 0) { throw "Installer exit code $($installer.ExitCode)." }
          $exe = @(Get-ChildItem -LiteralPath $installDir -File -Recurse -Filter '*.exe')
          $gui = @($exe | Where-Object { $_.BaseName -eq 'DownloadManager' })
          $cli = @($exe | Where-Object { $_.BaseName -match 'DownloadManagerCli$' })
          if ($gui.Count -ne 1 -or $cli.Count -ne 1) { throw "Expected one installed GUI and CLI: GUI=$($gui.Count), CLI=$($cli.Count)" }
          $digest = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "SourceSHA=$env:HYPERGET_TESTED_SHA`nInstallerSHA256=$digest" | Set-Content -LiteralPath 'build/ci-release/installer-sha256.txt' -Encoding utf8
          "HYPERGET_PROFILE_GUI=$($gui[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HYPERGET_PROFILE_CLI=$($cli[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Capture idle installed JVM baseline with NMT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # NMT is enabled only for this GUI process; it is not written to GITHUB_ENV.
          $env:JAVA_TOOL_OPTIONS = '-XX:NativeMemoryTracking=summary'
          $launcher = Start-Process -FilePath $env:HYPERGET_PROFILE_GUI -PassThru
          try {
            Start-Sleep -Seconds 20
            & ./scripts/Collect-WindowsJvmMemoryProfile.ps1 -GuiExecutable $env:HYPERGET_PROFILE_GUI -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/jvm-profile-before'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($launcher -and -not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
            Get-Process -Name 'DownloadManager' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Run one measured installed 1/4/16 round (21 SHA-verified downloads)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Run-WindowsActiveBenchmarkMatrix.ps1 -GuiExecutable $env:HYPERGET_PROFILE_GUI -CliExecutable $env:HYPERGET_PROFILE_CLI -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/active-transfer-bench' -Rounds 1 -SampleSeconds 8 -FileSizeMiB 32 -ServerChunkDelayMs 500 -CompletionTimeoutSeconds 300 -KeepGuiRunning -EnableNativeMemoryTracking
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/Summarize-WindowsActiveBenchmark.ps1 -Directory 'build/ci-release/active-transfer-bench' -SourceSha $env:HYPERGET_TESTED_SHA -Rounds 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture installed JVM heap, class histogram and thread dump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Collect-WindowsJvmMemoryProfile.ps1 -GuiExecutable $env:HYPERGET_PROFILE_GUI -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/jvm-profile'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload benchmark and JVM diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-installed-jvm-memory-profile
          path: |
            build/ci-release/installer-sha256.txt
            build/ci-release/active-transfer-bench/measurements/*.csv
            build/ci-release/active-transfer-bench/verified-transfers.csv
            build/ci-release/active-transfer-bench/round-summary.csv
            build/ci-release/active-transfer-bench/benchmark-report.md
            build/ci-release/active-transfer-bench/failure-diagnostics.txt
            build/ci-release/jvm-profile-before/**
            build/ci-release/jvm-profile/**
          if-no-files-found: warn
          retention-days: 7
