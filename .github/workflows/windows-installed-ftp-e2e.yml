name: Windows installed authenticated FTP pause-resume E2E

# Purposeful installed-Windows FTP acceptance for PR #3. Unlike source/JUnit tests,
# this compiles and installs the real GUI/CLI once, restarts it mid-transfer,
# checks REST + SHA-256, and verifies WinCred cleanup.
on:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-ftp-e2e.yml"
      - "scripts/LocalFtpFixture.py"
      - "scripts/test_local_ftp_fixture.py"
      - "scripts/Run-WindowsInstalledFtpE2E.ps1"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/AppComponent.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/download/add/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/enterurl/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/**"
      - "downloader/core/src/**/ftp/**"
  workflow_dispatch:
  push:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-installed-ftp-e2e.yml"
      - "scripts/LocalFtpFixture.py"
      - "scripts/test_local_ftp_fixture.py"
      - "scripts/Run-WindowsInstalledFtpE2E.ps1"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/AppComponent.kt"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/cli/download/add/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/pages/enterurl/**"
      - "desktop/app/src/main/kotlin/com/abdownloadmanager/desktop/utils/singleInstance/service/**"
      - "downloader/core/src/**/ftp/**"

permissions:
  contents: read

concurrency:
  group: windows-installed-ftp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-contract:
    name: Standard-library FTP fixture contract
    runs-on: ubuntu-latest
    env:
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        run: test "$(git rev-parse HEAD)" = "$HYPERGET_TESTED_SHA"
      - name: Validate fixture syntax and authenticated REST behavior
        run: |
          python3 -m py_compile scripts/LocalFtpFixture.py scripts/test_local_ftp_fixture.py
          python3 -m unittest scripts/test_local_ftp_fixture.py

  installed-ftp:
    name: Installed GUI/CLI authenticated FTP pause, restart, REST resume and SHA-256
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SKIP_ANDROID_BUILD: "true"
    steps:
      - name: Check out exact tested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:HYPERGET_TESTED_SHA) { throw 'Wrong FTP test source SHA' }
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exactly one NSIS Windows installer
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Install real GUI and CLI into a clean directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -File -Recurse -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, got $($installers.Count)." }
          $installDir = Join-Path $env:RUNNER_TEMP 'idm-ftp-e2e-installed'
          if (Test-Path -LiteralPath $installDir) { throw 'FTP install directory unexpectedly exists.' }
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw 'FTP E2E installer timed out.'
          }
          if ($installer.ExitCode -ne 0) { throw "Installer exit code $($installer.ExitCode)." }
          Start-Sleep -Seconds 2
          $exe = @(Get-ChildItem -LiteralPath $installDir -File -Recurse -Filter '*.exe')
          $gui = @($exe | Where-Object { $_.BaseName -eq 'DownloadManager' })
          $cli = @($exe | Where-Object { $_.BaseName -match 'DownloadManagerCli$' })
          if ($gui.Count -ne 1 -or $cli.Count -ne 1) {
            throw "Expected one installed GUI and CLI: GUI=$($gui.Count), CLI=$($cli.Count)"
          }
          "IDM_FTP_GUI=$($gui[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IDM_FTP_CLI=$($cli[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run installed authenticated FTP acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Run-WindowsInstalledFtpE2E.ps1 `
            -GuiExecutable $env:IDM_FTP_GUI `
            -CliExecutable $env:IDM_FTP_CLI `
            -SourceSha $env:HYPERGET_TESTED_SHA `
            -OutputDirectory 'build/ci-release/ftp-e2e'

      - name: Upload FTP protocol and SHA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-ftp-e2e-evidence
          path: |
            build/ci-release/ftp-e2e/ftp-e2e-report.json
            build/ci-release/ftp-e2e/ftp-stats.json
            build/ci-release/ftp-e2e/ftp-server-stdout.txt
            build/ci-release/ftp-e2e/ftp-server-stderr.txt
          if-no-files-found: warn
          retention-days: 14
