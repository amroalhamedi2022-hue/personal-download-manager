name: Private Windows validation

on:
  workflow_dispatch:
  push:
    branches: [main, codex/p2-10-restart-persistence, codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/private-windows-validation.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "buildSrc/**"
      - "compositeBuilds/**"
      - "desktop/**"
      - "downloader/**"
      - "integration/**"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Gradle wrapper and toolchain
        shell: bash
        run: ./gradlew --no-daemon --version

      - name: Run downloader tests and compile desktop app
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          :downloader:core:desktopTest
          :downloader:monitor:desktopTest
          :shared:app:desktopTest
          :desktop:app:compileKotlin

      - name: Verify JUnit XML completeness and zero skipped tests
        shell: pwsh
        run: ./scripts/Validate-WindowsJUnit.ps1 -MinimumTests 150

      - name: Create Windows package
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi

      - name: Stage exactly one installer EXE
        shell: pwsh
        run: |
          $source = Join-Path $PWD "build/ci-release/binaries"
          $installers = @(Get-ChildItem -LiteralPath $source -Filter "*.exe" -Recurse -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer EXE in $source; found $($installers.Count)."
          }
          $delivery = Join-Path $PWD "build/ci-release/single-installer"
          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination $delivery
          $single = @(Get-ChildItem -LiteralPath $delivery -File)
          if ($single.Count -ne 1 -or $single[0].Extension -ne ".exe") {
            throw "The delivery folder must contain only one EXE."
          }
          $digest = Get-FileHash -Algorithm SHA256 -LiteralPath $single[0].FullName
          Write-Host "Delivery: $($single[0].Name)"
          Write-Host "Installer SHA256: $($digest.Hash.ToLowerInvariant())"

      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-download-manager-windows-x64
          path: build/ci-release/single-installer/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload test result XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-test-results
          path: "**/build/test-results/**"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
