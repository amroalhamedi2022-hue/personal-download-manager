name: HyperGet FTP real loopback Pause REST and WinCred (Windows Kotlin)

# Purposeful FTP milestone: compile and run existing production-backed Apache FTP
# integration tests on Windows. Source-only contracts cannot prove REST sockets,
# cancellation, staged-file integrity or Windows Credential Manager behavior.
# This does not package or release an EXE.
on:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/hyperget-ftp-windows-milestone.yml"
      - "downloader/core/src/desktopMain/kotlin/ir/amirab/downloader/ftp/**"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/ftp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ftp-real-loopback:
    name: FTP 29 real Windows Kotlin JUnit tests
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact PR source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:HYPERGET_TESTED_SHA) { throw "Wrong source SHA: $actual" }
          Write-Host "FTP exact source SHA: $actual"
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
      - name: Compile and run real Apache FTP loopback and Windows WinCred tests
        shell: pwsh
        run: |
          & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict :downloader:core:desktopTest --tests '*FtpTransferClientTest*' --tests '*FtpResumeIdentityTest*' --tests '*FtpStagedIdentityTest*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require three JUnit XML suites and 29 passing tests
        shell: pwsh
        run: |
          $dir = 'downloader/core/build/test-results/desktopTest'
          $names = @('FtpTransferClientTest', 'FtpResumeIdentityTest', 'FtpStagedIdentityTest')
          $total = 0
          foreach ($name in $names) {
            $path = Join-Path $dir "TEST-ir.amirab.downloader.ftp.$name.xml"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing FTP JUnit XML: $name" }
            [xml]$doc = Get-Content -LiteralPath $path -Raw
            $suite = $doc.SelectSingleNode('//testsuite')
            if ($null -eq $suite) { throw "Invalid JUnit XML: $name" }
            foreach ($field in @('failures', 'errors', 'skipped')) {
              if ([int]$suite.GetAttribute($field) -ne 0) { throw "FTP JUnit $field in $name" }
            }
            $count = [int]$suite.GetAttribute('tests')
            if ($count -lt 1) { throw "Empty FTP test suite: $name" }
            $total += $count
            Write-Host "$name : $count tests, zero failures/errors/skips"
          }
          if ($total -lt 29) { throw "Expected >=29 real FTP JUnit tests; got $total" }
          Write-Host "PASS: $total FTP JUnit tests on Windows; source SHA $env:HYPERGET_TESTED_SHA"
      - name: Upload exact-SHA FTP JUnit XML (no EXE)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-ftp-windows-loopback-junit
          path: downloader/core/build/test-results/desktopTest/TEST-ir.amirab.downloader.ftp.Ftp*Test.xml
          if-no-files-found: warn
          retention-days: 7
