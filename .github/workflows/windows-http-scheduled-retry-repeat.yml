name: Windows scheduled HTTP retry repetition

on:
  workflow_dispatch:
  push:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/windows-http-scheduled-retry-repeat.yml"

permissions:
  contents: read

jobs:
  three-independent-retries:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      SKIP_ANDROID_BUILD: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Repeat real queue+host+HTTP retry scenario three times
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $PWD 'build/retry-repeat-results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            Write-Host "=== Independent scheduled HTTP retry run $iteration / 3 ==="
            & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict --rerun-tasks :downloader:core:desktopTest --tests '*ActualRestoredRetryJobTest.scheduledRestoredHttpRetriesWaitForWindowAndRespectQueueHostAndPartLimits*'
            $code = $LASTEXITCODE
            $reports = Join-Path $PWD 'downloader/core/build/test-results/desktopTest'
            $destination = Join-Path $results "run-$iteration"
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            if (Test-Path -LiteralPath $reports) {
              Get-ChildItem -LiteralPath $reports -Filter 'TEST-*.xml' -File | Copy-Item -Destination $destination
            }
            $xml = @(Get-ChildItem -LiteralPath $destination -Filter 'TEST-*.xml' -File)
            if ($xml.Count -lt 1) { throw "Iteration $iteration produced no JUnit XML." }
            $total = 0
            foreach ($file in $xml) {
              [xml]$doc = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($suite in @($doc.SelectNodes('//testsuite'))) {
                $total += [int]$suite.GetAttribute('tests')
                if ([int]$suite.GetAttribute('failures') -gt 0 -or
                    [int]$suite.GetAttribute('errors') -gt 0 -or
                    [int]$suite.GetAttribute('skipped') -gt 0) {
                  throw "Iteration $iteration has a failing or skipped JUnit result."
                }
              }
            }
            if ($code -ne 0 -or $total -lt 1) {
              throw "Iteration $iteration did not pass. Exit=$code tests=$total"
            }
          }
      - name: Upload all three independent JUnit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-http-retry-3x-junit
          path: build/retry-repeat-results
          if-no-files-found: ignore
          retention-days: 7
