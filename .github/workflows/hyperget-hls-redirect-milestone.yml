name: HyperGet HLS redirect, complete segment and SHA256 milestone (Windows Kotlin)

# The guarded-redirect-unit job remains compile/JUnit-only. The dependent
# installed-hls-process-restart job builds one test installer for a named
# Windows process-kill/relaunch acceptance question; it is not a release build.
on:
  pull_request:
    branches: [codex/repair-rf00-rf01]
    paths:
      - ".github/workflows/hyperget-hls-redirect-milestone.yml"
      - "build.gradle.kts"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HlsGuardedRedirects.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentCredentialPolicy.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HLSDownloadJob.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentIdentity.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentIdentityTest.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HLSPartDownloader.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentTransferValidation.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentTransferLoopbackTest.kt"
      - "downloader/core/src/commonMain/kotlin/ir/amirab/downloader/destination/SegmentedDownloadDestination.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsSegmentAssemblySafetyTest.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsDownloadJobResumeLoopbackTest.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsGuardedRedirectTest.kt"
      - "downloader/core/src/desktopTest/kotlin/ir/amirab/downloader/downloaditem/hls/HlsGuardedRedirectLoopbackTest.kt"
      - "shared/app/src/commonMain/kotlin/com/abdownloadmanager/shared/downloaderinui/hls/HLSLinkChecker.kt"
      - "scripts/LocalHlsRestartFixture.py"
      - "scripts/Run-WindowsInstalledHlsRestartE2E.ps1"
      - "scripts/source-tests/test_hyperget_hls_restart_e2e_source.py"
      - "desktop/app/resources/installer/nsis-script-template.nsi"
      - "desktop/app/build.gradle.kts"
      - "desktop/app/icons/icon.ico"
      - "desktop/app/icons/hyperget-icon.svg"
      - "buildSrc/src/main/kotlin/buildlogic/versioning/VersionUtil.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-redirect-unit:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SKIP_ANDROID_BUILD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          cache: gradle
      - name: Compile and execute guarded HLS redirect Kotlin tests only
        shell: pwsh
        run: |
          & ./gradlew.bat --no-daemon --stacktrace --dependency-verification strict :downloader:core:desktopTest --tests '*HlsGuardedRedirect*Test*' --tests '*HlsSegmentIdentityTest*' --tests '*HlsSegmentTransferLoopbackTest*' --tests '*HlsSegmentAssemblySafetyTest*' --tests '*HlsDownloadJobResumeLoopbackTest*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require six JUnit XML suites, 29 tests and zero failures or skips
        shell: pwsh
        run: |
          $dir = 'downloader/core/build/test-results/desktopTest'
          $reports = @(Get-ChildItem -LiteralPath $dir -Filter 'TEST-ir.amirab.downloader.downloaditem.hls.Hls*Test.xml' -File)
          if ($reports.Count -ne 6) { throw "Expected redirect, identity and transfer HLS JUnit XML files" }
          $total = 0
          foreach ($file in $reports) {
            [xml]$doc = Get-Content -LiteralPath $file.FullName -Raw
            $suite = $doc.SelectSingleNode('//testsuite')
            if ($null -eq $suite -or [int]$suite.GetAttribute('failures') -ne 0 -or
                [int]$suite.GetAttribute('errors') -ne 0 -or
                [int]$suite.GetAttribute('skipped') -ne 0) {
              throw "Guarded HLS milestone JUnit acceptance failed: $($file.Name)"
            }
            $total += [int]$suite.GetAttribute('tests')
          }
          if ($total -lt 29) { throw "Expected at least 29 HLS milestone tests, got $total" }
      - name: Upload JUnit evidence (no executable)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-hls-complete-segment-sha256-junit
          path: downloader/core/build/test-results/desktopTest/TEST-ir.amirab.downloader.downloaditem.hls.Hls*Test.xml
          if-no-files-found: warn
          retention-days: 7
  installed-hls-process-restart:
    needs: guarded-redirect-unit
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SKIP_ANDROID_BUILD: "true"
      HYPERGET_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact tested PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate HLS restart source contract and script syntax before any build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/LocalHlsRestartFixture.py scripts/source-tests/test_hyperget_hls_restart_e2e_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/source-tests/test_hyperget_hls_restart_e2e_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scriptPath in @('scripts/Run-WindowsInstalledHlsRestartE2E.ps1','scripts/Wait-WindowsLoopbackHttpPort.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $scriptPath), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $scriptPath : $($errors -join '; ')" }
            Write-Host "PASS: PowerShell syntax $scriptPath"
          }
      - name: Set up JetBrains Runtime 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jetbrains
          java-package: jdk
          java-version: "25"
          check-latest: true
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build one Windows installer for process-restart acceptance
        shell: bash
        run: >-
          ./gradlew --no-daemon --stacktrace
          --dependency-verification strict
          createReleaseFolderForCi
      - name: Install HyperGet and test HLS process kill, relaunch, resume and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'build/ci-release/binaries' -Filter '*.exe' -Recurse -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one test installer, found $($installers.Count)." }
          $root = Join-Path $env:RUNNER_TEMP 'hyperget-hls-process-restart'
          $appDir = Join-Path $root 'application'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path $appDir -Force | Out-Null
          New-Item -ItemType Directory -Path 'build/ci-release/hls-restart-e2e' -Force | Out-Null
          $installerSha = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$appDir") -PassThru
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent HyperGet test installer timed out.'
          }
          if ($installer.ExitCode -ne 0) { throw "Silent installer exit=$($installer.ExitCode)." }
          if (@(Get-Process -Name 'DownloadManager','HyperGet' -ErrorAction SilentlyContinue).Count -ne 0) { throw 'Silent installer unexpectedly launched the GUI.' }
          $executables = @(Get-ChildItem -LiteralPath $appDir -Filter '*.exe' -Recurse -File)
          $gui = @($executables | Where-Object { $_.BaseName -ceq 'HyperGet' })
          $legacyGui = @($executables | Where-Object { $_.BaseName -ceq 'DownloadManager' })
          $cli = @($executables | Where-Object { $_.BaseName -ceq 'DownloadManagerCli' })
          if ($gui.Count -ne 1 -or $legacyGui.Count -ne 0 -or $cli.Count -ne 1) {
            throw "Installed identity mismatch: HyperGet=$($gui.Count), legacy GUI=$($legacyGui.Count), CLI=$($cli.Count)."
          }
          @(
            "SourceSha=$env:HYPERGET_TESTED_SHA"
            "InstallerPath=$($installers[0].FullName)"
            "InstallerSHA256=$installerSha"
          ) | Set-Content -LiteralPath 'build/ci-release/hls-restart-e2e/installer-provenance.txt' -Encoding utf8
          & ./scripts/Run-WindowsInstalledHlsRestartE2E.ps1 -GuiExecutable $gui[0].FullName -CliExecutable $cli[0].FullName -SourceSha $env:HYPERGET_TESTED_SHA -OutputDirectory 'build/ci-release/hls-restart-e2e'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installed HLS restart evidence and fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyperget-installed-hls-process-restart-evidence
          path: build/ci-release/hls-restart-e2e/**
          if-no-files-found: warn
          retention-days: 7
